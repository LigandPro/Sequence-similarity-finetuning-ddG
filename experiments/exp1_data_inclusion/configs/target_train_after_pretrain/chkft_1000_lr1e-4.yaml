# FLEET.PRETRAINED_CHECKPOINT: the directory this experiment's pretrain config writes; the fine-tune starts from its last checkpoint. Point it elsewhere if you keep checkpoints elsewhere.
FLEET:
  PRETRAINED_CHECKPOINT: checkpoints/exp1_data_inclusion/pretrain/
  TEST_DIR: data/splits/exp1_data_inclusion/test/target_per_cluster
  TRAIN_DIR: data/splits/exp1_data_inclusion/target_train/1000
MODEL:
  DECODER_LAYERS: 2
  ENCODER_LAYERS: 1
  ESM_CHECKPOINT: facebook/esm2_t6_8M_UR50D
  MLP_LAYERS: 3
  PRECODER_LAYERS: 1
  SELFATT_DIM_EXPANSION: 2
TEST:
  BATCH_SIZE: 400
TRAIN:
  BATCH_SIZE: 400
  EARLY_STOPPING_PATIENCE_STEPS: 250
  EVAL_STEPS: 50
  LR: 1.0e-04
  MAX_STEPS: 1200


