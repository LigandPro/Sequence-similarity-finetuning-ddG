[project]
name = "thermality"
version = "0.1.0"
description = "Sequence-similarity fine-tuning for ddG prediction — code and data for the paper"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.26",
    "bitsandbytes>=0.45",
    "matplotlib>=3.7",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "scienceplots>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "torch>=2.2",
    "transformers>=4.40,<5",
    "yacs>=0.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thermality"]
